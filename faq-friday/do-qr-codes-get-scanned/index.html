<p>FAQ Friday · Issue 07 · August 7, 2026 · 3 min read · QR Codes</p>
<h1>Do QR codes on print actually get scanned?</h1>
<h2>The short answer</h2>
<p class="speakable-lead">More than ever — when you give people a reason. The old excuse for ignoring a code (needing a special app) is gone: every phone now scans straight from the camera. So codes get scanned far more than they did five years ago — but only when the reader knows what they will get.</p>
<h2>By the numbers</h2>
<ul><li>About half of Gen Z and Millennial consumers use a QR code at least weekly — 49% and 51% respectively</li><li>68% of U.S. adults surveyed had used a QR code at least once in the past year</li><li>GS1 is targeting the end of 2027 to replace the retail barcode itself with a QR code, already testing in 48 countries</li><li>Zero apps required — every phone (iOS 11+, Android 9+) scans straight from the camera</li><li>No independent, published scan rate exists for print QR codes — vendor figures of 18%, 26% and 38% all come from companies measuring codes they sold</li><li>Below about one inch square, scan reliability drops — test iOS and Android before the run</li></ul>
<p><em>Sources: TEAM LEWIS Research, survey of 1,000 U.S. adults, 2024; GS1 Sunrise 2027</em></p>
<h2>One honest catch</h2>
<p>A code needs a reason to scan. &quot;Scan me&quot; does nothing; &quot;Scan for 15% off&quot; or &quot;Scan to book&quot; does. A code that resolves to your homepage has broken the promise it just made.</p>

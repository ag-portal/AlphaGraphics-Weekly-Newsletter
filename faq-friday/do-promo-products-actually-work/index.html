<h1>Do branded promo products actually work?</h1>
<h2>The short answer</h2>
<p class="speakable-lead">Yes — because people keep them, and remember you. 85% of consumers remember the advertiser who gave them a logoed product, and 78% keep a promotional product because they find it useful. Bags are the best performer; outerwear and drinkware are kept longest; pens are useful but discarded first.</p>
<h2>By the numbers</h2>
<ul><li>85% remember the advertiser who gave them a logoed product</li><li>78% keep a promo product because they find it useful</li><li>75% hold a positive opinion of branded merch</li><li>76% are more likely to do business with a brand that gave them merch</li></ul>
<p><em>Sources: 2026 ASI Global Advertising Impressions Study</em></p>
<h2>One honest catch</h2>
<p>It only works if it is worth keeping. A $1 pen used daily beats a $12 gadget nobody understands — buy fewer, better items.</p>

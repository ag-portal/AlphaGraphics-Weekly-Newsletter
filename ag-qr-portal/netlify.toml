[build]
  publish = "."

[build.processing]
  skip_processing = true

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = false
  minify = false

[build.processing.images]
  compress = false

# Week 06 onward use descriptive slugs. Weeks 01–05 keep their published
# /newsletters/WeekNN.html URLs untouched.
[[redirects]]
  from = "/newsletters/Week06.html"
  to = "/faq-friday/do-promo-products-actually-work/"
  status = 301
  force = true

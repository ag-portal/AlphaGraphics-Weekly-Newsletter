<h1>Does big, bold signage get noticed?</h1>
<h2>The short answer</h2>
<p class="speakable-lead">Yes — if it says one thing, in a spot where the right people actually look. Big does not earn attention: placement earns attention and clarity keeps it. Put the sign where your customers already are, give it one message they can read in a glance, and you pay once and it works every day after.</p>
<h2>What the research found</h2>
<ul><li>61% of consumers say they have failed to find a business because its sign was too small or unclear</li><li>Adding one sign produced an average sales lift of 4.75% — more than a larger building or longer hours</li><li>91% of consumers say a sign should be readable at a glance by a passing motorist</li><li>One message, readable from 100 feet — a wrap gets two seconds at 40 mph</li></ul>
<h2>Match the format to how long the audience lasts</h2>
<ul><li>A day to a season → a banner, fast to produce and easy to swap</li><li>A lease → window film or wall graphics</li><li>Five to seven years on the move → a vehicle wrap, the only format that changes its own location to find its audience</li><li>As long as the doors are open → channel letters, dimensional and lit</li></ul>
<p><em>Sources: The Economic Value of On-Premise Signage (University of San Diego, 1997; updated by the University of Cincinnati Economics Center, 2012); Consumer Perceptions of Retail Signage; BrandSpark / Better Homes and Gardens American Shopper Study. The economic studies were commissioned by the sign industry's research foundation, though carried out by the universities, and date to 1997 and 2012 — old, but still the only rigorous research on the question.</em></p>
<h2>One honest catch</h2>
<p>Big only works when it is clear, and clarity beats size every time. Going bigger only makes bad design bigger — a cluttered banner is just a cluttered business card everyone in the parking lot can read.</p>

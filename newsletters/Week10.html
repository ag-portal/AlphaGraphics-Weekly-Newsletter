<h1>Do business cards matter in 2026?</h1>
<h2>The short answer</h2>
<p class="speakable-lead">Yes, and for a reason that has nothing to do with nostalgia. Almost everything else in your marketing is something people look at. A card is something they pick up, turn over, and put in a pocket. For most prospects it is the only piece of your work they will ever hold in their hands. That means the question was never whether cards still matter. It's whether yours is worth keeping.</p>
<h2>What the research actually shows</h2>
<ul><li>Sappi North America worked with neuroscientist <strong>Dr. David Eagleman</strong> on a reading experiment: the same brochure on coated paper, on uncoated paper, and on a screen</li><li>The premium-paper group had the best comprehension and recall and the most favorable impression of the company</li><li>A week later, brand-name recall in that group ran about <strong>3:1</strong> over the others</li><li>A run of <strong>250 double-sided cards starts around $60</strong>, and finishes and heavier stocks move up from there</li></ul>
<p><em>Sources: A Communicator's Guide to the Neuroscience of Touch, Sappi North America with Dr. David Eagleman, 2015; Hurley et al., "The Effect of Decorative Foil Stamping on Consumer Attention," Journal of Applied Packaging Research, Clemson University. Sappi manufactures paper, so the finding is not disinterested, and the study measured brochures, not business cards. It establishes the mechanism, not a number you can apply to a card order.</em></p>
<h2>One honest catch</h2>
<p>A card only works when it feels intentional. It can't make the case for you, and it isn't always the right tool — if your work is visual and the conversation happens at a table, that's what a brochure or a folded leave-behind is for. Get the standard right, and the card is a sample of it.</p>

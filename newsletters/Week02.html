<h1>Will a new sign actually bring in customers?</h1>
<h2>The short answer</h2>
<p class="speakable-lead">Yes — your sign is the best-value salesperson you will ever hire. 76% of people have entered a business for the first time simply because of its sign. Your storefront works 24/7, in front of every car and every pedestrian, whether or not you are open.</p>
<h2>By the numbers</h2>
<ul><li>76% have entered a business for the first time because of its sign</li><li>68% judge product and service quality by signage</li><li>60% say poor or missing signs kept them from going in</li><li>50% say an unclear sign made a business hard to find</li></ul>
<p><em>Sources: FedEx Office Signage Survey</em></p>
<h2>One honest catch</h2>
<p>A sign gets them to the door once. It brings them in; your brand brings them back.</p>
